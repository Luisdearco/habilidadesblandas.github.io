<main class="auth hero-foto"><div class="caja"><h1>Solicita tu cuenta</h1><p class="sub">Las cuentas y las matrículas las crea tu profesor. Envíale estos datos.</p><form data-registro><label for="n">Nombre completo</label><input id="n" name="nombre" required><label for="c">Cédula</label><input id="c" name="cedula" inputmode="numeric" required><label for="e">Correo (opcional)</label><input id="e" name="correo" type="email"><label for="cu">Curso de interés</label><select id="cu" name="curso"><option>Comunicación asertiva</option><option>Liderazgo</option><option>Trabajo en equipo</option><option>Inteligencia emocional</option><option>Oratoria</option><option>Control del tiempo</option></select><p class="aviso" role="status"></p><button class="btn" type="submit">Enviar solicitud</button></form><div class="enlaces"><a href="login.html">¿Ya tienes cuenta? Inicia sesión</a></div></div></main>
